<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3(b) - Kenyan Online News Portal Navbar | CAT2 (25/03809)</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f9fa;
        }
        /* Horizontal Navigation Bar Styling */
        .navbar {
            background-color: #1a1a2e;
            padding: 15px 0;
        }
        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-evenly; /* Evenly spaces all links */
            align-items: center;
        }
        .navbar ul li a {
            color: #ffffff;          /* White link text */
            text-decoration: none;   /* No underline on links */
            font-size: 16px;
            font-weight: bold;
            padding: 8px 14px;
            transition: color 0.3s ease;
        }
        .navbar ul li a:hover {
            color: #f0a500;          /* Changes to orange on hover */
        }
        .content {
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home (Index)</a></li>
            <li><a href="#politics">Politics</a></li>
            <li><a href="#business">Business</a></li>
            <li><a href="#technology">Technology</a></li>
            <li><a href="#sports">Sports</a></li>
            <li><a href="#counties">Counties</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>Kenyan Online News Portal</h1>
    </div>

</body>
</html>
